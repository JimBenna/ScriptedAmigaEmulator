name: Build release
on:
  push:
#    branches:
#      - new_css
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v2.1.3, etc.


permissions:
  contents: write  # Required to create releases
  packages: write  # Required if publishing to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
#          ref: ${{ github.head_ref || github.ref_name }}
          ref: 'new_css'
          fetch-depth: 0
#      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The reference name is ${{ github.ref_name }}."
      - run: echo "The GitHub head reference is ${{ github.head_ref }}."      
#      - run: echo “Event Name ${{ github.event_name }}”
#      - run: echo “Commit SHA ${{ github.sha }}”
#      - run: echo “Repository ${{ github.repository }}”
#      - run: echo “Actor ${{ github.actor }}”
#      - run: echo “Branch/Tag ${{ github.ref }}”
#      - run: echo “Workflow ${{ github.workflow }}”
#      - run: echo "Registry ${{ env.REGISTRY }}"
#      - run: echo "Image Name  ${{ env.IMAGE_NAME }}"
#      - run: echo "Github Workspace ${{ github.workspace }}"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer npm 12.0.2
        run: npm install --global npm@12.0.2

      - name: Installer Closure Compiler
        run: npm install --global google-closure-compiler

# To compile the javascript a lot of errors have to be corrected in several files.
# Until then, following lines have been commented
      - name: Compile project
        run: make

      - name: Check computed files
        run: |
          test -f scriptedamigaemulator.js
#          test -f sae/scriptedamigaemulator.js.map

#      - name: auto minify files with different engines
#        uses: nizarmah/auto-minify@v3
#        with:
#          directory: 'sae'
#          output: 'js'
#           js_engine: 'uglify-js'
#           css_engine: 'clean-css'

#      - name: auto commit the minified files
#        uses: stefanzweifel/git-auto-commit-action@v7
#        with:
#           commit_message: "[BOT] : Add auto minified javascript files to js directory"


# Generate a version number
      - name: Compute version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi

          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          LAST_COMMIT=$(git log -1 --pretty=%s)

          if [[ "$LAST_COMMIT" == major:* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$LAST_COMMIT" == minor:* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "new_version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

# Create a new GIT Tag.
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.ref_name }}
          git push origin ${{ steps.version.outputs.new_version }}
#          git tag ${{ steps.version.outputs.new_version }}
          
# Generate changelog from conventional commits
# This action will bump version, tag commit and generate a changelog with conventional commits.
      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
#           github-token: ${{ secrets.TOKEN }}
           output-file: "false"  # Don't write to file, use output
#           skip-version-file: true
#           skip-commit: true
#           skip-tag: true

# Generate changelog from conventional commits
# GitHub action that builds your release notes / changelog fast, simple and exactly the way you want.

#      - name: Build Changelog
#        id: github_release
#        uses: mikepenz/release-changelog-builder-action@v6
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Create distributable archives
      - name: Create release archives
        run: |
          tar -czvf sae_release-${{ steps.version.outputs.new_version }}.tar.gz ./sae/*.js ./images/* ./css/* ./*.html ./Makefile
          
          zip -r sae_release-${{ steps.version.outputs.new_version }}.zip ./sae/*.js ./images/* ./css/* ./*.html ./Makefile

# Calculate checksums for verification
      - name: Generate checksums
        run: |
          sha256sum sae_release-${{ steps.version.outputs.new_version }}.tar.gz sae_release-${{ steps.version.outputs.new_version }}.zip > checksums.txt

# Create GitHub Release with all artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
#          name: Release ${{ github.ref_name }}
#          body: ${{ steps.changelog.outputs.changelog }}
#          tag_name: ${{ steps.version.outputs.new_version }}          
#          name: ${{ steps.changelog.outputs.tag }}
          name: sae ${{ steps.version.outputs.new_version }}            
#          body: ${{steps.github_release.outputs.changelog}}          
          body: ${{steps.changelog.outputs.clean_changelog}}
          draft: false
          prerelease: false
          files: |
            sae_release-${{ steps.version.outputs.new_version }}.tar.gz
            sae_release-${{ steps.version.outputs.new_version }}.zip
            checksums.txt



