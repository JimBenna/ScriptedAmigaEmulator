name: Build release
on:
  push:
    branches:
      - new_css
#    tags:
#      - 'v*'  # Trigger on tags like v1.0.0, v2.1.3, etc.


permissions:
  contents: write  # Required to create releases
  packages: write  # Required if publishing to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The reference is ${{ github.ref }}."
      - run: echo “Event Name ${{ github.event_name }}”
      - run: echo “Commit SHA ${{ github.sha }}”
      - run: echo “Repository ${{ github.repository }}”
      - run: echo “Actor ${{ github.actor }}”
      - run: echo “Branch/Tag ${{ github.ref }}”
      - run: echo “Workflow ${{ github.workflow }}”
      - run: echo "Registry ${{ env.REGISTRY }}"
      - run: echo "Image Name  ${{ env.IMAGE_NAME }}"
      - run: echo "Github Workspace ${{ github.workspace }}"

      - name: auto minify files with different engines
        uses: nizarmah/auto-minify@v3
        with:
          directory: 'sae'
#           js_engine: 'uglify-js'
#           css_engine: 'clean-css'

      - name: auto commit the minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
           commit_message: "bot: Add auto minified files"


# Generate a version number
      - name: Compute version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi

          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          LAST_COMMIT=$(git log -1 --pretty=%s)

          if [[ "$LAST_COMMIT" == major:* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$LAST_COMMIT" == minor:* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "new_version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

# Create a new GIT Tag.
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

# Generate changelog from conventional commits
      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
#           github-token: ${{ secrets.TOKEN }}
           output-file: "false"  # Don't write to file, use output
           skip-version-file: true
           skip-commit: true
#           skip-tag: true

# Create distributable archives
      - name: Create release archives
        run: |
          tar --exclude="./.github" --exclude="./.git" --exclude="./.gitignore"-czvf sae_release-${{ steps.version.outputs.new_version }}.tar.gz ./sae/*.min.js ./images/* ./css/* ./index.js ./*.css ./*.htm ./*.html ./Makefile
          
          zip -r sae_release-${{ steps.version.outputs.new_version }}.zip . -x ".git/*" -x ".github/workflows/*"

# Calculate checksums for verification
      - name: Generate checksums
        run: |
          sha256sum sae-*.tar.gz sae-*.zip > checksums.txt

# Create GitHub Release with all artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
#          prerelease: ${{ contains(github.ref_name, '-') }}  # Pre-release if tag has hyphen
          files: |
            sae_release-${{ steps.version.outputs.new_version }}.tar.gz
            sae_release-${{ steps.version.outputs.new_version }}.zip
            checksums.txt



